<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Devhub Solutions</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0a0e1a;
        color: #e6ecff;
        text-align: center;
        padding: 2rem;
      }
      .card {
        max-width: 420px;
        padding: 2.5rem;
        background: linear-gradient(135deg, rgba(20,30,55,0.7), rgba(15,20,32,0.55));
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 1.25rem;
        backdrop-filter: blur(16px);
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 1.25rem;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        border-radius: 0.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        font-weight: 700;
        color: white;
        box-shadow: 0 0 24px rgba(59,130,246,0.45);
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; font-weight: 600; }
      p { color: rgba(230,236,255,0.6); margin: 0 0 1.5rem; font-size: 0.875rem; line-height: 1.5; }
      button {
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        color: white;
        border: 0;
        padding: 0.625rem 1.25rem;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover { transform: scale(1.03); transition: transform 0.15s; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">D</div>
      <h1>Bạn đang ngoại tuyến</h1>
      <p>Không có kết nối mạng. Trang bạn vừa xem vẫn可用 — hãy kết nối lại để tiếp tục.</p>
      <button onclick="location.reload()">Thử lại</button>
    </div>
  </body>
</html>
