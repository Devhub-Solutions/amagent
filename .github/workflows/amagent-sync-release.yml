name: Sync release from AmAgentCore

on:
  # Automatically run after this workflow is committed or updated.
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub may delay scheduled workflows by a few minutes.
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-amagent-release
  cancel-in-progress: false

env:
  SOURCE_REPO: Devhub-Solutions/AmAgentCore
  TARGET_REPO: Devhub-Solutions/amagent

jobs:
  sync-release:
    name: Sync new Core release
    runs-on: ubuntu-latest

    steps:
      - name: Check source token
        env:
          SOURCE_TOKEN: ${{ secrets.AMAGENTCORE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_TOKEN" ]]; then
            echo "Missing AMAGENTCORE_READ_TOKEN." >&2
            echo "It must be a fine-grained token with Contents: Read on $SOURCE_REPO." >&2
            exit 1
          fi

      - name: Read latest source release tag
        id: source
        env:
          GH_TOKEN: ${{ secrets.AMAGENTCORE_READ_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(gh api "repos/$SOURCE_REPO/releases/latest" --jq .tag_name)"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Latest AmAgentCore release: $tag"

      - name: Check whether release is already synced
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/$TARGET_REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "synced=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG is already present in amagent; nothing to do."
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG is not present in amagent; syncing it now."
          fi

      - name: Download release assets from AmAgentCore
        if: steps.target.outputs.synced == 'false'
        env:
          GH_TOKEN: ${{ secrets.AMAGENTCORE_READ_TOKEN }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets

          gh release download "$TAG" \
            --repo "$SOURCE_REPO" \
            --dir release-assets \
            --pattern 'AmAgent-*' \
            --pattern 'SHA256SUMS'

          expected=(
            AmAgent-windows.msi
            AmAgent-macos-arm.dmg
            AmAgent-macos-intel.dmg
            AmAgent-linux-amd64.deb
            AmAgent-linux-x86_64.rpm
            SHA256SUMS
          )
          for file in "${expected[@]}"; do
            test -f "release-assets/$file" || {
              echo "Missing required asset: $file" >&2
              exit 1
            }
          done

      - name: Verify SHA-256 checksums
        if: steps.target.outputs.synced == 'false'
        working-directory: release-assets
        run: sha256sum -c SHA256SUMS

      - name: Create public release in amagent
        if: steps.target.outputs.synced == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$TARGET_REPO" \
            --title "AmAgent $TAG" \
            --notes "Installer release synced from $SOURCE_REPO release $TAG." \
            --latest \
            release-assets/*
